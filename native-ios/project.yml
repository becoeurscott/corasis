name: TogetherNative
options:
  bundleIdPrefix: com.ebenezer
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: LGHS3SPMJ7
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  TogetherNative:
    type: application
    platform: iOS
    sources:
      - path: Together
      - path: Shared
      - path: ../shared/product.json
        buildPhase: resources
      - path: ../shared/product.fr.json
        buildPhase: resources
      - path: ../shared/sounds
        buildPhase: resources
    dependencies:
      - target: TogetherWidgetExtension
    entitlements:
      path: Together/Together.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.ebenezer.corasis
    info:
      path: Together/Info.plist
      properties:
        CFBundleDisplayName: Corasis
        CFBundleURLTypes:
          - CFBundleURLSchemes: [together-swift]
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Capture a daily moment to share with your partner.
        NSMicrophoneUsageDescription: Record a private voice note for your partner.
        NSLocationAlwaysAndWhenInUseUsageDescription: Tell your partner when you arrive at or leave a saved place, and alert you both when you are close, even when Corasis is closed.
        NSLocationWhenInUseUsageDescription: Show your country flag on Home, and your location to your partner only while sharing is enabled.
        NSPhotoLibraryAddUsageDescription: Save your Together wallpaper to Photos.
        NSFaceIDUsageDescription: Unlock Together using Face ID.
        InsForgeURL: https://eza6mmh8.eu-central.insforge.app
        InsForgeAnonKey: anon_2e2ecda0f70426ab2b2cd3c7f9db3e080b230cbc3adee01890d2cf319406185a
        ITSAppUsesNonExemptEncryption: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ebenezer.corasis
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: 3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TogetherWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TogetherWidget
      - path: Shared
    entitlements:
      path: TogetherWidget/TogetherWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ebenezer.corasis
    info:
      path: TogetherWidget/Info.plist
      properties:
        CFBundleDisplayName: Together Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ebenezer.corasis.widgets
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Together Widgets
        INFOPLIST_KEY_NSHumanReadableCopyright: ''
  TogetherTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TogetherTests]
    dependencies:
      - target: TogetherNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TogetherNative:
    build:
      targets:
        TogetherNative: all
    run:
      storeKitConfiguration: Together/Plus.storekit
    test:
      targets: [TogetherTests]
